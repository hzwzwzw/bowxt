[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisord.pid

[program:xvfb]
priority=10
command=/usr/local/bin/bowxt-start-xvfb
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:desktop]
priority=20
command=/usr/local/bin/bowxt-start-desktop
user=wechat
environment=HOME="/home/wechat",USER="wechat",DISPLAY=":1"
autorestart=true
startsecs=4
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:wechat]
priority=30
command=/usr/local/bin/bowxt-start-wechat
user=wechat
environment=HOME="/home/wechat",USER="wechat",DISPLAY=":1"
autorestart=true
startsecs=5
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:fcitx5]
priority=25
command=/usr/local/bin/bowxt-start-fcitx5
user=wechat
environment=HOME="/home/wechat",USER="wechat",DISPLAY=":1"
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:x11vnc]
priority=40
command=/usr/local/bin/bowxt-start-vnc
user=wechat
environment=HOME="/home/wechat",USER="wechat",DISPLAY=":1"
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:novnc]
priority=50
command=/usr/local/bin/bowxt-start-novnc
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:web]
priority=60
command=/usr/local/bin/bowxt-start-web
user=wechat
environment=HOME="/home/wechat",USER="wechat",DISPLAY=":1"
autorestart=true
startsecs=3
startretries=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
