name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --no-deps -e .
      - name: Unit tests
        run: PYTHONPATH=src:tests python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n manage.sh scripts/*
      - name: Compile
        run: python -m compileall -q src tests
